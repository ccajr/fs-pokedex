name: Periodic health check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *'

jobs:
  health_check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the deployed app url
        uses: jtalk/url-health-check-action@v5
        with:
          url: ${{ secrets.RENDER_APP_URL }}/health